<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Course Apply Academy | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="login-bg">
    <div class="login-card">
        <div class="brand-icon">🎓</div>
        <h2>Course Apply Academy</h2>
        <p class="text-muted">Student Login Portal</p>
        <form method="post">
            <label class="form-label" for="username">Username</label><input class="form-control mb-3" id="username"
                name="username" required>
            <label class="form-label" for="password">Password</label><input class="form-control mb-3" type="password"
                id="password" name="password" required>
            <button class="btn btn-primary w-100">Login</button>
        </form>
        {% if error %}<div class="alert alert-danger mt-3 mb-0">{{ error }}</div>{% endif %}
        <div class="small text-muted mt-4">Demo login: THARUN / THARUN123</div>
    </div>
</body>

</html>
