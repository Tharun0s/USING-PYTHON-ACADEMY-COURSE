<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Apply for Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container"><a class="navbar-brand fw-bold" href="/home">🎓 Course Apply Academy</a><a
                class="btn btn-light btn-sm" href="/home">Back to Courses</a></div>
    </nav>
    <div class="container py-5">
        <div class="form-card mx-auto">
            <h2 class="fw-bold">Course Application</h2>
            <p class="text-muted">Course: <strong>{{ course.name }}</strong> · Fee: <strong>₹{{ course.fee }}</strong>
            </p>
            {% for category,message in get_flashed_messages(with_categories=true) %}<div
                class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}
            {% if db_error %}<div class="alert alert-danger">{{ db_error }}</div>{% endif %}
            <form method="post">
                <label class="form-label">Student Name</label><input class="form-control mb-3" name="name" required>
                <label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email"
                    required>
                <label class="form-label">Phone Number</label><input class="form-control mb-3" name="phone"
                    pattern="[0-9+ -]{8,20}" required>
                <label class="form-label">Qualification</label><select class="form-select mb-4" name="qualification"
                    required>
                    <option value="">Select qualification</option>
                    <option>12th Pass</option>
                    <option>Diploma</option>
                    <option>UG</option>
                    <option>PG</option>
                    <option>Other</option>
                </select>
                <button class="btn btn-primary w-100">Submit Application</button>
            </form>
        </div>
    </div>
</body>

</html>
